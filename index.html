<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090909">
<title>OSON_BAZAR — Online Market</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090909;color:#fff;font-family:Arial,sans-serif}
header{background:#101010;border-bottom:1px solid #5b4924;padding:20px 5%;display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}
.logo{font-size:27px;font-weight:900;color:#d8b45a;letter-spacing:2px}
.actions{display:flex;gap:8px}
button{cursor:pointer;border:1px solid #d8b45a;border-radius:7px;padding:10px 15px;background:#d8b45a;color:#111;font-weight:bold}
button.active{background:#111;color:#d8b45a}
main{max-width:1100px;margin:auto;padding:35px 18px}
.search{width:100%;padding:15px;background:#191919;border:1px solid #514326;border-radius:9px;color:white;font-size:15px}
h2{color:#d8b45a;margin-top:35px}
.categories{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}
.category{padding:12px 17px;border:1px solid #514326;border-radius:8px;color:#ddd;background:#171717}
.empty{margin-top:30px;padding:65px 15px;text-align:center;background:#151515;border:1px solid #393020;border-radius:13px}
.empty h3{color:#d8b45a;font-size:21px}
.empty p{color:#aaa}
footer{text-align:center;padding:25px;color:#777;border-top:1px solid #332b1b;margin-top:60px}
</style>
</head>
<body>
<header>
 <div>
  <div class="logo">OSON_BAZAR</div>
  <div style="font-size:12px;color:#999;margin-top:5px" id="tagline">Qulay xaridlar — qulay to‘lovlar</div>
 </div>
 <div class="actions">
  <button class="active" id="uz" onclick="setLang('uz')">UZ</button>
  <button class="active" id="ru" onclick="setLang('ru')">RU</button>
 </div>
</header>

<main>
 <input class="search" id="search" placeholder="Mahsulot qidirish...">

 <h2 id="catTitle">Kategoriyalar</h2>
 <div class="categories">
  <div class="category" id="c1">Elektronika</div>
  <div class="category" id="c2">Uy-ro‘zg‘or</div>
  <div class="category" id="c3">Aksessuarlar</div>
  <div class="category" id="c4">Boshqa mahsulotlar</div>
 </div>

 <div class="empty">
  <h3 id="emptyTitle">Hozircha mahsulotlar yo‘q</h3>
  <p id="emptyText">Yangi mahsulotlar tez orada joylashtiriladi.</p>
 </div>
</main>

<footer>© OSON_BAZAR</footer>

<script>
function setLang(lang){
 document.documentElement.lang=lang;
 document.getElementById("uz").classList.toggle("active",lang==="uz");
 document.getElementById("ru").classList.toggle("active",lang==="ru");

 const t={
 uz:{
 tagline:"Qulay xaridlar — qulay to‘lovlar",
 search:"Mahsulot qidirish...",
 cat:"Kategoriyalar",
 c1:"Elektronika",c2:"Uy-ro‘zg‘or",
 c3:"Aksessuarlar",c4:"Boshqa mahsulotlar",
 empty:"Hozircha mahsulotlar yo‘q",
 text:"Yangi mahsulotlar tez orada joylashtiriladi."
 },
 ru:{
 tagline:"Удобные покупки — удобная оплата",
 search:"Поиск товаров...",
 cat:"Категории",
 c1:"Электроника",c2:"Для дома",
 c3:"Аксессуары",c4:"Другие товары",
 empty:"Пока товаров нет",
 text:"Новые товары скоро появятся."
 }
 };
 const x=t[lang];
 document.getElementById("tagline").textContent=x.tagline;
 document.getElementById("search").placeholder=x.search;
 document.getElementById("catTitle").textContent=x.cat;
 ["c1","c2","c3","c4"].forEach((id,i)=>document.getElementById(id).textContent=x[id]);
 document.getElementById("emptyTitle").textContent=x.empty;
 document.getElementById("emptyText").textContent=x.text;
}
setLang("uz");
</script>
</body>
</html>
