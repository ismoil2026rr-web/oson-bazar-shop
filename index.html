<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090909">
<title>OSON_BAZAR — Online Market</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090909;color:#fff;font-family:Arial,sans-serif}
header{padding:22px 16px;text-align:center;border-bottom:1px solid #44391f}
.logo{font-size:28px;font-weight:900;color:#d8b45a;letter-spacing:2px}
header p{color:#aaa;font-size:13px}
.container{max-width:1100px;margin:auto;padding:20px 15px}
h2{color:#d8b45a}
#status{text-align:center;color:#d8b45a;padding:20px}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}
.product{background:#171717;border:1px solid #40351f;border-radius:13px;padding:17px}
.product img{width:100%;height:170px;object-fit:contain;border-radius:8px}
.product h3{margin:12px 0 7px}
.category{color:#aaa;font-size:13px}
.price{color:#e5c36c;font-size:21px;font-weight:bold;margin:12px 0}
.monthly{color:#ddd;font-size:14px;margin-bottom:14px}
button{background:#d8b45a;color:#111;border:0;padding:12px 16px;border-radius:8px;font-weight:bold;cursor:pointer}
.order{margin-top:25px;background:#171717;border:1px solid #40351f;padding:20px;border-radius:13px}
input,textarea{width:100%;padding:13px;margin:7px 0;background:#252525;color:white;border:1px solid #555;border-radius:8px}
footer{text-align:center;color:#888;padding:25px;font-size:13px}
</style>
</head>
<body>

<header>
 <div class="logo">OSON_BAZAR</div>
 <p>Qulay xaridlar — qulay to‘lovlar</p>
</header>

<main class="container">
 <h2>Mahsulotlar</h2>
 <div id="status">Mahsulotlar yuklanmoqda...</div>
 <div class="products" id="products"></div>

 <div class="order" id="order">
  <h2>Buyurtma berish</h2>
  <p id="selected">Mahsulot tanlanmagan</p>
  <input id="customer" placeholder="Ismingiz">
  <input id="phone" type="tel" placeholder="Telefon raqamingiz">
  <textarea id="comment" placeholder="Izoh (ixtiyoriy)"></textarea>
  <button onclick="sendOrder()">Buyurtma yuborish</button>
  <p id="orderStatus"></p>
 </div>
</main>

<footer>© OSON_BAZAR — Barcha huquqlar himoyalangan</footer>

<script>
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbyQ4QCo-fmbwvMInEggLIdMMYpsCw_tBg4KKbCZEhxzTnsuMeMn5wYB0HDBUn_LCZL7/exec";

let products=[];
let selectedProduct=null;

function money(n){
 return Number(n).toLocaleString("uz-UZ")+" so‘m";
}

function loadProducts(){
 const callbackName="osonProductsCallback";
 const old=document.getElementById("productsScript");
 if(old)old.remove();

 window[callbackName]=function(data){
  products=Array.isArray(data)?data:[];
  renderProducts();
  delete window[callbackName];
 };

 const script=document.createElement("script");
 script.id="productsScript";
 script.src=SCRIPT_URL+"?action=products&callback="+callbackName;
 script.onerror=function(){
  document.getElementById("status").textContent=
   "Mahsulotlarni yuklashda xatolik. Sahifani yangilang.";
 };
 document.body.appendChild(script);
}

function renderProducts(){
 const box=document.getElementById("products");
 const status=document.getElementById("status");
 box.innerHTML="";

 if(products.length===0){
  status.textContent="Hozircha mahsulot mavjud emas.";
  return;
 }

 status.textContent="";

 products.forEach(p=>{
  const card=document.createElement("div");
  card.className="product";

  if(p.image){
   const img=document.createElement("img");
   img.src=p.image;
   img.alt=p.name;
   img.onerror=()=>img.style.display="none";
   card.appendChild(img);
  }

  const name=document.createElement("h3");
  name.textContent=p.name;

  const category=document.createElement("div");
  category.className="category";
  category.textContent=p.category;

  const price=document.createElement("div");
  price.className="price";
  price.textContent=money(p.price);

  const monthly=document.createElement("div");
  monthly.className="monthly";
  const months=Number(p.months);
  monthly.textContent=months>0
   ? months+" oyga: "+money(Math.ceil(Number(p.price)/months))+" / oy"
   : "Muddat belgilanmagan";

  const btn=document.createElement("button");
  btn.textContent="Buyurtma berish";
  btn.onclick=()=>{
   selectedProduct=p;
   document.getElementById("selected").textContent=
    "Tanlangan mahsulot: "+p.name;
   document.getElementById("order").scrollIntoView({behavior:"smooth"});
  };

  card.append(name,category,price,monthly,btn);
  box.appendChild(card);
 });
}

async function sendOrder(){
 if(!selectedProduct){
  alert("Avval mahsulot tanlang.");
  return;
 }

 const name=document.getElementById("customer").value.trim();
 const phone=document.getElementById("phone").value.trim();
 const comment=document.getElementById("comment").value.trim();

 if(!name||!phone){
  alert("Ism va telefon raqamingizni kiriting.");
  return;
 }

 const data={
  name:name,
  phone:phone,
  product:selectedProduct.name,
  comment:comment
 };

 document.getElementById("orderStatus").textContent=
  "Buyurtma so‘rovi yuborilmoqda...";

 try{
  await fetch(SCRIPT_URL,{
   method:"POST",
   mode:"no-cors",
   headers:{"Content-Type":"text/plain;charset=utf-8"},
   body:JSON.stringify(data)
  });

  document.getElementById("orderStatus").textContent=
   "So‘rov yuborildi. Buyurtma qabul qilinganini operator tasdiqlaydi.";
 }catch(e){
  document.getElementById("orderStatus").textContent=
   "Ulanishda xatolik. Qayta urinib ko‘ring.";
 }
}

loadProducts();
</script>
</body>
</html>
